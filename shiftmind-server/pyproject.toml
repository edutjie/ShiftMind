[project]
name = "shiftmind-server"
version = "0.1.0"
description = "ShiftMind laptop server — FastAPI backend for AR-glasses memory retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "requests>=2.32",
]

[tool.uv]
package = false

