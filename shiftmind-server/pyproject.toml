[project]
name = "shiftmind-server"
version = "0.1.0"
description = "ShiftMind laptop server — FastAPI backend for AR-glasses memory retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "requests>=2.32",
    "insightface>=0.7.3",
    "onnxruntime>=1.18",
    "pymilvus[milvus_lite]>=2.5",
    "openai>=1.90",
    "python-dotenv>=1.0",
    "websockets>=15",
    "python-socks>=2.8.2",
    "aiohttp>=3.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

